[package]
name = "ps2-tracker"
description = "PS2 Session Tracker – session stats and overlay for PlanetSide 2 (Census API only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "ps2-tracker"

[features]
default = ["dialog-gtk"]
# file dialogs: GTK (native packages, AppImage) or the xdg-desktop-portal
# FileChooser (Flatpak: picks files outside the sandbox without home access)
dialog-gtk = ["tauri-plugin-dialog/gtk3"]
dialog-portal = ["tauri-plugin-dialog/xdg-portal"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
ps2-tracker-core = { path = "../crates/ps2-tracker-core" }
tauri = { version = "2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = { version = "2.8.4", default-features = false }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
# no default features: "zip" pulls zip 4.x (RUSTSEC-2026-0367/0368/0369) and is
# only needed for zipped update bundles; ours are the AppImage and the NSIS setup
tauri-plugin-updater = { version = "2.12.0", default-features = false, features = ["rustls-tls"] }
discord-rich-presence = "1.1.0"
# same rustls as reqwest; the updater adds the ring backend, so the process
# default provider must be chosen explicitly (see main)
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav", "vorbis", "flac", "mp3"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1.19", features = ["sync"] }
base64 = "0.23.1"
tracing.workspace = true
tracing-subscriber.workspace = true

# X11 window properties (focus detection, OSD window type) – Linux only
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14.0"

# active window and its process name (focus detection) – Windows only
[target.'cfg(windows)'.dependencies]
active-win-pos-rs = "0.11.0"
# win_console.rs: console for CLI output and the debug mode, cursor clip of the
# move layer (same version as in the Tauri stack, no second copy)
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true

# Trigger conditions for sound events (PS2 Session Tracker).
#
# Each rule maps an event (our own ID or a Recursion key) to a condition derived
# from ESS data. All conditions are OUR OWN definitions - a Recursion pack only
# contains keys and files, no conditions. Keys without a rule have "no trigger
# yet" and never fire.
#
# Custom rules: copy this file to $XDG_CONFIG_HOME/ps2-tracker/triggers.toml and
# edit it; if that file exists, it replaces this rule set completely.
#
# on = base fact from the ESS data:
#   kill            kill (headshot, roadkill, weapon_category, vehicle = attacker's vehicle)
#   first_kill      first kill of the session
#   multikill       kill chain, count = length (gap <= multikill window)
#   headshot_streak headshot kills in a row, count = length
#   repeat_victim   repeated kill on the same enemy, count = number in the session
#   revenge         kill on the character who killed you last
#   mutual          mutual kill with the same enemy within 3 s
#   streak          kill streak reaches count (step in the session settings)
#   streak_ended    own streak (>= step) ended by a death
#   death           death by an enemy
#   nemesis         death by the same enemy, count = number in the session
#   death_streak    deaths without an own kill in between, count = number
#   suicide, teamkill, teamkilled, revive, revived
#   vehicle_kill    vehicle destroyed (vehicle = vehicle name from Census)
#   achievement, login, session_start
#
# Filters (optional): count (exact), min_count, headshot, roadkill,
#   weapon_category (Census weapon category), vehicle (vehicle names),
#   session_count (fires on the n-th match of the rule in a session).
# priority 0-100: more important sounds interrupt less important ones.

# ---------------------------------------------------------------- own events
[[trigger]]
event = "kill"
on = "kill"
headshot = false
priority = 10
description = "Kill without headshot"

[[trigger]]
event = "headshot"
on = "kill"
headshot = true
priority = 25
description = "Kill with headshot"

[[trigger]]
event = "multikill"
on = "multikill"
priority = 70
description = "Kill chain (>= 2 kills within the multikill window)"

[[trigger]]
event = "streak"
on = "streak"
priority = 60
description = "Kill streak milestone"

[[trigger]]
event = "streak_ended"
on = "streak_ended"
priority = 45
description = "Own streak ended by a death"

[[trigger]]
event = "death"
on = "death"
priority = 40
description = "Death by an enemy"

[[trigger]]
event = "suicide"
on = "suicide"
priority = 45
description = "Suicide"

[[trigger]]
event = "teamkill"
on = "teamkill"
priority = 55
description = "Teamkill committed"

[[trigger]]
event = "teamkilled"
on = "teamkilled"
priority = 50
description = "Teamkilled"

[[trigger]]
event = "revive"
on = "revive"
priority = 30
description = "Revive given"

[[trigger]]
event = "revived"
on = "revived"
priority = 30
description = "Revived"

[[trigger]]
event = "revenge"
on = "revenge"
priority = 65
description = "Kill on your last killer"

[[trigger]]
event = "nemesis"
on = "nemesis"
min_count = 3
priority = 60
description = "At least the 3rd death by the same enemy"

[[trigger]]
event = "vehicle_kill"
on = "vehicle_kill"
priority = 50
description = "Vehicle destroyed"

[[trigger]]
event = "achievement"
on = "achievement"
priority = 80
description = "Own achievement unlocked"

[[trigger]]
event = "login"
on = "login"
priority = 20
description = "Logged in to the game"

[[trigger]]
event = "session_start"
on = "session_start"
priority = 20
description = "Session started"


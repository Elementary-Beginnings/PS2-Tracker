# ---------------------------------------------------------------- keys of the binary packs
[[trigger]]
event = "PER_KILL"
on = "kill"
priority = 10
description = "Every kill"

[[trigger]]
event = "SESSION_STARTED"
on = "session_start"
priority = 20
description = "Session started"

# Own death. No pack has a PER_DEATH key; DEATH_INSULT is in all packs seen so
# far and is used as the pack sound for an own death (derived from its name and
# how the packs use it, not documented by Recursion).
[[trigger]]
event = "DEATH_INSULT"
on = "death"
priority = 40
description = "Own death (least specific pack key)"

# Killed by a team mate. Derived from the key names only (not documented):
# WHOSE_SIDE / PREVENT_FF; the first one a pack has a sound for plays.
[[trigger]]
event = "WHOSE_SIDE"
on = "teamkilled"
priority = 50
description = "Killed by a team mate (derived from the name)"

[[trigger]]
event = "PREVENT_FF"
on = "teamkilled"
priority = 49
description = "Killed by a team mate (derived from the name)"

# ---------------------------------------------------------------- derived from the key name only
# Conditions below are NOT documented by Recursion; they follow from the key
# names and should be checked against real Recursion behaviour (edit here or
# in your own triggers.toml). SUICIDE_BOMBER, VIP_KILL, VIP_TEAM_KILL and
# QUAD_DAMAGE stay without a trigger (would need data the tracker does not
# have, or the meaning is unclear).
[[trigger]]
event = "HEAD_HUNTER"
on = "headshot_streak"
count = 5
priority = 58
description = "5 headshot kills in a row (derived from the name – please verify)"

[[trigger]]
event = "ROAD_RAGE"
on = "multikill"
min_count = 3
roadkill = true
priority = 75
description = "Kill chain of 3+ ending with a road kill (derived from the name – please verify)"

[[trigger]]
event = "DEATH_FROM_ABOVE"
on = "kill"
vehicle = ["Mosquito", "Reaver", "Scythe", "Dervish", "Liberator", "Galaxy", "Valkyrie"]
priority = 52
description = "Kill from an aircraft (derived from the name – please verify)"

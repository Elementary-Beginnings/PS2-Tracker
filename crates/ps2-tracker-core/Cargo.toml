[package]
name = "ps2-tracker-core"
description = "Census REST/ESS client, event model, session logic, achievements, voice packs and persistence for the PS2 Session Tracker (no GUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
directories.workspace = true
futures-util.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
toml.workspace = true
tracing.workspace = true
csv.workspace = true
rust_xlsxwriter = { version = "0.103.0", default-features = false }
base64 = "0.23.1"
png = "0.18.1"
quick-xml = "0.42.0"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
keyring-core = "1.1.0"
getrandom = "0.4.3"
sha2 = "0.11.1"

# online sync: refresh token in the OS keyring (keyring-core with the
# platform stores; Secret Service over zbus, pure Rust crypto, no libdbus)
[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[dev-dependencies]
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

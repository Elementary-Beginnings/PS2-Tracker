# cargo-deny: Advisories und Herkunft der Abhängigkeiten.
[graph]
# the shipped targets; `hyprland` (GPL-3.0) only appears under active-win-pos-rs
# for Linux, but that crate is used on Windows only, so it is never built
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[advisories]
yanked = "deny"
# Tauri/GTK3-Stack: gtk-rs-Crates (GTK 3) sind als "unmaintained" gemeldet,
# solange Tauri v2 auf webkit2gtk-4.1/GTK 3 setzt. Kein Sicherheitsbefund.
unmaintained = "workspace"
# Consciously accepted advisories (checked 2026-11-23, cargo audit 0.23.0,
# `cargo tree -i <crate> --target all`): all are transitive and none has a fix
# reachable from the current stable parents. cargo-deny does not report them
# (unmaintained/unsound are checked for workspace crates only), so they are
# listed for cargo audit in .cargo/audit.toml; reasons there and in
# docs/wiki/Security.md. Re-check on every Tauri update:
#   RUSTSEC-2024-0429 glib 0.18.5 (unsound)          Tauri 2 GTK 3 stack (gtk-rs 0.18)
#   RUSTSEC-2024-0370 proc-macro-error 1.0.4 (unm.)  build-time, glib-macros 0.18
#   RUSTSEC-2026-0370/0371/0372 zvariant, zbus_names, zvariant_derive (unm.)
#                                                    zbus 5 <- tauri-plugin-single-instance 2.5.5
#   RUSTSEC-2026-0543 chrono 0.4.45 (unm.)           kdotool <- active-win-pos-rs; never compiled

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
# Projekt: MIT OR Apache-2.0. Erlaubt sind nur Lizenzen, die sich damit
# verbreiten lassen (MPL-2.0: Dateiebene, Quellen der Crates sind öffentlich).
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "Unlicense",
  "CC0-1.0",
  "Unicode-3.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]

# hyprland/hyprland-macros (GPL-3.0) are a Linux-only dependency of
# active-win-pos-rs, which this project uses on Windows only
# (src-tauri/Cargo.toml: [target.'cfg(windows)'.dependencies]). cargo tree
# --target x86_64-unknown-linux-gnu / x86_64-pc-windows-msvc -i hyprland shows
# nothing: they are never compiled into a shipped binary. cargo-deny unions the
# cfg conditions of all listed targets and therefore still sees them.
[[licenses.exceptions]]
crate = "hyprland"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "hyprland-macros"
allow = ["GPL-3.0-or-later"]

# Flatpak bundle with the official tooling: flatpak/flatpak-github-actions in
# Flathub's container with the GNOME 51 SDK (current flatpak-builder,
# appstream-compose and appstreamcli).
#
# - Test build: manually (Run workflow) or on pull requests that touch the
#   packaging. No environment, no secrets: the bundle has no built-in Census
#   service ID. The bundle is uploaded as artifact "flatpak".
# - Release build: release.yml calls this workflow (workflow_call) with
#   environment "release" and the tag's commit; the environment's secret
#   CENSUS_DEFAULT_SERVICE_ID then goes in through a temporary
#   .cargo/config.toml (tools/flatpak_cargo_env.sh), never into the manifest.
name: Flatpak

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "packaging/flatpak/**"
      - "src-tauri/**"
      - "Cargo.lock"
      - ".github/workflows/flatpak.yml"
      - "tools/flatpak_*.sh"
  workflow_call:
    inputs:
      ref:
        description: "Commit to build (default: the triggering commit)"
        type: string
        default: ""
      environment:
        description: "Deployment environment of the build job (release for releases)"
        type: string
        default: ""
    secrets:
      CENSUS_DEFAULT_SERVICE_ID:
        required: false

permissions: {}

concurrency:
  group: flatpak-${{ github.workflow_ref }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "26.13.1"

jobs:
  sources:
    name: Frontend and crate sources
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # no caches: this job also feeds release builds (cache poisoning)
          package-manager-cache: false
      - name: Tools
        run: |
          sudo apt-get update -qq
          # Ubuntu 24.04: tomlkit 0.12 (flatpak-cargo-generator needs >= 0.11)
          sudo apt-get install -y -qq --no-install-recommends \
            desktop-file-utils python3-aiohttp python3-tomlkit
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bash tools/flatpak_sources.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-sources
          path: |
            dist/
            packaging/flatpak/cargo-sources.json
          if-no-files-found: error
          retention-days: 1

  build:
    name: flatpak-builder (GNOME 51)
    needs: sources
    runs-on: ubuntu-24.04
    # empty for test builds (no environment, no secrets); "release" when
    # release.yml calls this workflow
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      # flatpak-builder needs bubblewrap with namespaces inside the container
      options: --privileged
      # The image ships the GNOME SDK preinstalled in /var/lib/flatpak. When
      # Flathub has a newer build, flatpak-builder (--install-deps-from)
      # updates it, and deploying renames directories; on the container's
      # overlayfs that fails with EXDEV ("Invalid cross-device link") for
      # directories from the image layer. An anonymous volume puts
      # /var/lib/flatpak on the host filesystem; Docker copies the image's
      # preinstalled runtimes into the new volume, so nothing is downloaded
      # twice when they are current.
      volumes:
        - /var/lib/flatpak
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-sources
          path: .
      - name: Validate the MetaInfo
        run: appstreamcli validate --no-net --explain packaging/flatpak/dev.herz.Ps2Tracker.metainfo.xml
      - name: Build-time defaults (temporary .cargo/config.toml)
        env:
          CENSUS_DEFAULT_SERVICE_ID: ${{ secrets.CENSUS_DEFAULT_SERVICE_ID }}
          DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID }}
          SYNC_DISCORD_CLIENT_ID: ${{ vars.SYNC_DISCORD_CLIENT_ID }}
        run: bash tools/flatpak_cargo_env.sh write
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: packaging/flatpak/dev.herz.Ps2Tracker.yml
          bundle: ps2-tracker.flatpak
          repository-name: flathub
          repository-url: https://dl.flathub.org/repo/flathub.flatpakrepo
          # no build cache: release builds must not reuse state (cache poisoning)
          cache: false
          upload-artifact: true
          artifact-name: flatpak
      - name: Remove the temporary .cargo/config.toml
        if: always()
        run: bash tools/flatpak_cargo_env.sh remove

# Release: builds every package on GitHub-hosted runners and creates the GitHub
# release with the CHANGELOG section as text, SHA256SUMS and build provenance
# attestations. Two ways to start it:
#   - push a tag vX.Y.Z (tools/release.sh), or
#   - Actions -> Release -> Run workflow with input "version" (= version in
#     Cargo.toml) on main: the first job creates the tag vX.Y.Z on that commit
#     through the API. A tag created with GITHUB_TOKEN starts no new workflow,
#     so the same run builds it. A tag ruleset may need "GitHub Actions" as
#     bypass actor, and the environment "release" must allow main (see
#     docs/release.md).
#
# Secrets only in the environment "release", never in pull request workflows:
#   CENSUS_DEFAULT_SERVICE_ID          built-in Census service ID (optional)
#   TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) updater signatures (optional; without
#                                       them no .sig and no latest.json)
# Variables (optional, public): DISCORD_APP_ID – built-in Discord application
# (Rich Presence); SYNC_DISCORD_CLIENT_ID – Discord application of the ELME
# stats server (online sync sign-in).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (X.Y.Z, must equal the version in Cargo.toml); creates the tag vX.Y.Z on the selected commit
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NODE_VERSION: "26.13.1"

jobs:
  verify:
    name: Version, tag and commit
    runs-on: ubuntu-24.04
    permissions:
      contents: write # only used by "Run workflow": create the tag through the API
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: check_versions (tag = v<version>)
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Run workflow only on main"; exit 1
            fi
            if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version must be X.Y.Z"; exit 1
            fi
            TAG="v${INPUT_VERSION}"
          else
            TAG="$REF_NAME"
          fi
          bash tools/check_versions.sh "$TAG"
          python3 -I tools/release_notes.py "${TAG#v}" CHANGELOG.md > /dev/null
          {
            echo "version=${TAG#v}"
            echo "tag=${TAG}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - name: Create the tag (Run workflow only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          set -eu
          # annotated tag object, then the ref; fails if the tag already exists
          obj=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$TAG" -f message="PS2 Session Tracker ${VERSION}" \
            -f object="$SHA" -f type=commit --jq .sha)
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" -f sha="$obj" --silent
          echo "created ${TAG} -> ${SHA}"

  linux:
    name: Linux (tarball, AppImage)
    needs: verify
    # deliberately the oldest supported runner: the binary, the tarball and the
    # AppImage link against its glibc (2.35) and then run on older systems too
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libxdo-dev libssl-dev patchelf file
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # no caches in release builds (cache poisoning)
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - run: pnpm install --frozen-lockfile
      - name: Build (release binary)
        env:
          CENSUS_DEFAULT_SERVICE_ID: ${{ secrets.CENSUS_DEFAULT_SERVICE_ID }}
          DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID }}
          SYNC_DISCORD_CLIENT_ID: ${{ vars.SYNC_DISCORD_CLIENT_ID }}
        run: |
          . tools/ci_build_env.sh
          pnpm tauri build --no-bundle
          check_embedded target/release/ps2-tracker
          mkdir -p out
          bash tools/linux_tarball.sh target/release/ps2-tracker out/ps2-tracker-x86_64-linux.tar.gz
      - name: AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then UPD="--config src-tauri/tauri.updater.conf.json"; else UPD=""; fi
          # shellcheck disable=SC2086
          pnpm tauri bundle --bundles appimage $UPD
          cp target/release/bundle/appimage/*.AppImage out/ps2-tracker-x86_64.AppImage
          for f in target/release/bundle/appimage/*.AppImage.sig; do
            if [ -e "$f" ]; then cp "$f" out/ps2-tracker-x86_64.AppImage.sig; fi
          done
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: out/
          if-no-files-found: error

  arch:
    name: Arch package and AUR files
    needs: [verify, linux]
    # host only; the build runs in the Arch container
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: archlinux:base-devel@sha256:fa2d4ce3310ddd90a4208e5168be8ad367da5129af1245f38fd2d803bcbe3239
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: dist-linux
      - name: makepkg
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          V="${TAG#v}"
          useradd -m builder
          mkdir -p /tmp/pkg /tmp/aur out
          cp packaging/aur/PKGBUILD dist-linux/ps2-tracker-x86_64-linux.tar.gz /tmp/pkg/
          cp packaging/aur/PKGBUILD /tmp/aur/
          bash tools/aur_update.sh "$V" /tmp/pkg/ps2-tracker-x86_64-linux.tar.gz /tmp/pkg/PKGBUILD --local
          # the AUR file downloads the release tarball, same checksum
          bash tools/aur_update.sh "$V" dist-linux/ps2-tracker-x86_64-linux.tar.gz /tmp/aur/PKGBUILD
          chown -R builder /tmp/pkg /tmp/aur
          (cd /tmp/pkg && sudo -u builder makepkg -d --noconfirm)
          (cd /tmp/aur && sudo -u builder makepkg --printsrcinfo > .SRCINFO)
          cp /tmp/pkg/ps2-tracker-bin-[0-9]*.pkg.tar.zst out/ps2-tracker-x86_64.pkg.tar.zst
          cp /tmp/aur/PKGBUILD out/ps2-tracker-bin.PKGBUILD
          cp /tmp/aur/.SRCINFO out/ps2-tracker-bin.SRCINFO
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch
          path: out/
          if-no-files-found: error

  windows:
    name: Windows (NSIS)
    needs: verify
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # no caches in release builds (cache poisoning)
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - run: pnpm install --frozen-lockfile
      - name: Build (NSIS setup)
        env:
          CENSUS_DEFAULT_SERVICE_ID: ${{ secrets.CENSUS_DEFAULT_SERVICE_ID }}
          DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID }}
          SYNC_DISCORD_CLIENT_ID: ${{ vars.SYNC_DISCORD_CLIENT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          . tools/ci_build_env.sh
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then UPD="--config src-tauri/tauri.updater.conf.json"; else UPD=""; fi
          # shellcheck disable=SC2086
          pnpm tauri build --bundles nsis $UPD
          check_embedded target/release/ps2-tracker.exe
          mkdir -p out
          cp target/release/bundle/nsis/*-setup.exe out/ps2-tracker-x64-setup.exe
          for f in target/release/bundle/nsis/*-setup.exe.sig; do
            if [ -e "$f" ]; then cp "$f" out/ps2-tracker-x64-setup.exe.sig; fi
          done
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: out/
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle
    needs: verify
    # same workflow as the test build (flatpak.yml), here with the environment
    # "release" and its Census service ID; a failure does not stop the release
    # (see the condition of the release job), the bundle is missing then
    uses: $/.github/workflows/flatpak.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.verify.outputs.sha }}
      environment: release
    secrets:
      CENSUS_DEFAULT_SERVICE_ID: ${{ secrets.CENSUS_DEFAULT_SERVICE_ID }}

  release:
    name: GitHub release
    needs: [verify, linux, arch, windows, flatpak]
    if: >-
      !cancelled() && needs.verify.result == 'success' && needs.linux.result == 'success'
      && needs.arch.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # create the release and upload its files
      id-token: write # OIDC token for the provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          # only the release files, not the intermediate flatpak-sources
          pattern: "{linux,arch,windows,flatpak}"
          merge-multiple: true
      - name: Checksums, updater manifest, release text
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          cp THIRD-PARTY-NOTICES.md LICENSE-MIT LICENSE-APACHE out/
          if [ -e out/ps2-tracker-x86_64.AppImage.sig ] || [ -e out/ps2-tracker-x64-setup.exe.sig ]; then
            python3 -I tools/updater_manifest.py "$VERSION" out \
              "https://github.com/${REPO}/releases/download/${TAG}" CHANGELOG.md > out/latest.json
          fi
          (cd out && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          python3 -I tools/release_notes.py "$VERSION" CHANGELOG.md > release-notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          gh release create "$TAG" --verify-tag --repo "$GITHUB_REPOSITORY" \
            --title "PS2 Session Tracker ${VERSION}" --notes-file release-notes.md out/*

# Release for a tag vX.Y.Z: builds every package on GitHub-hosted runners and
# creates the GitHub release with the CHANGELOG section as text, SHA256SUMS and
# build provenance attestations.
#
# Secrets only in the environment "release" (restrict it to tags v* in the
# repository settings), never in pull request workflows:
#   CENSUS_DEFAULT_SERVICE_ID          built-in Census service ID (optional)
#   TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) updater signatures (optional; without
#                                       them no .sig and no latest.json)
# Variable (optional): DISCORD_APP_ID – built-in Discord application (public).
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NODE_VERSION: "26.13.1"
  # flatpak-builder-tools: commit and SHA-256 of flatpak-cargo-generator.py
  FCG_COMMIT: "9d86d336a39b9af38b86f114b6ce5820fe260f91"
  FCG_SHA256: "0a2db6be87d75910facef28ab46d4d6460802e8419ab850d0caa6a364d26b380"

jobs:
  verify:
    name: Tag matches the version
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check_versions (tag = v<version>)
        env:
          TAG: ${{ github.ref_name }}
        run: bash tools/check_versions.sh "$TAG"
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          python3 -I tools/release_notes.py "${TAG#v}" CHANGELOG.md > /dev/null

  linux:
    name: Linux (tarball, AppImage)
    needs: verify
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libxdo-dev libssl-dev patchelf file
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # no caches in release builds (cache poisoning)
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - run: pnpm install --frozen-lockfile
      - name: Build (release binary)
        env:
          CENSUS_DEFAULT_SERVICE_ID: ${{ secrets.CENSUS_DEFAULT_SERVICE_ID }}
          DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID }}
        run: |
          . tools/ci_build_env.sh
          pnpm tauri build --no-bundle
          check_embedded target/release/ps2-tracker
          mkdir -p out
          bash tools/linux_tarball.sh target/release/ps2-tracker out/ps2-tracker-x86_64-linux.tar.gz
      - name: AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then UPD="--config src-tauri/tauri.updater.conf.json"; else UPD=""; fi
          # shellcheck disable=SC2086
          pnpm tauri bundle --bundles appimage $UPD
          cp target/release/bundle/appimage/*.AppImage out/ps2-tracker-x86_64.AppImage
          for f in target/release/bundle/appimage/*.AppImage.sig; do
            if [ -e "$f" ]; then cp "$f" out/ps2-tracker-x86_64.AppImage.sig; fi
          done
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: out/
          if-no-files-found: error

  arch:
    name: Arch package and AUR files
    needs: linux
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    container:
      image: archlinux:base-devel@sha256:fa2d4ce3310ddd90a4208e5168be8ad367da5129af1245f38fd2d803bcbe3239
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: dist-linux
      - name: makepkg
        env:
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#v}"
          useradd -m builder
          mkdir -p /tmp/pkg /tmp/aur out
          cp packaging/aur/PKGBUILD dist-linux/ps2-tracker-x86_64-linux.tar.gz /tmp/pkg/
          cp packaging/aur/PKGBUILD /tmp/aur/
          bash tools/aur_update.sh "$V" /tmp/pkg/ps2-tracker-x86_64-linux.tar.gz /tmp/pkg/PKGBUILD --local
          # the AUR file downloads the release tarball, same checksum
          bash tools/aur_update.sh "$V" dist-linux/ps2-tracker-x86_64-linux.tar.gz /tmp/aur/PKGBUILD
          chown -R builder /tmp/pkg /tmp/aur
          (cd /tmp/pkg && sudo -u builder makepkg -d --noconfirm)
          (cd /tmp/aur && sudo -u builder makepkg --printsrcinfo > .SRCINFO)
          cp /tmp/pkg/ps2-tracker-bin-[0-9]*.pkg.tar.zst out/ps2-tracker-x86_64.pkg.tar.zst
          cp /tmp/aur/PKGBUILD out/ps2-tracker-bin.PKGBUILD
          cp /tmp/aur/.SRCINFO out/ps2-tracker-bin.SRCINFO
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch
          path: out/
          if-no-files-found: error

  windows:
    name: Windows (NSIS)
    needs: verify
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # no caches in release builds (cache poisoning)
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - run: pnpm install --frozen-lockfile
      - name: Build (NSIS setup)
        env:
          CENSUS_DEFAULT_SERVICE_ID: ${{ secrets.CENSUS_DEFAULT_SERVICE_ID }}
          DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          . tools/ci_build_env.sh
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then UPD="--config src-tauri/tauri.updater.conf.json"; else UPD=""; fi
          # shellcheck disable=SC2086
          pnpm tauri build --bundles nsis $UPD
          check_embedded target/release/ps2-tracker.exe
          mkdir -p out
          cp target/release/bundle/nsis/*-setup.exe out/ps2-tracker-x64-setup.exe
          for f in target/release/bundle/nsis/*-setup.exe.sig; do
            if [ -e "$f" ]; then cp "$f" out/ps2-tracker-x64-setup.exe.sig; fi
          done
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: out/
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle
    needs: verify
    runs-on: ubuntu-22.04
    environment: release
    # a failed Flatpak build does not stop the release (the bundle is missing then)
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # no caches in release builds (cache poisoning)
          package-manager-cache: false
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            flatpak flatpak-builder appstream desktop-file-utils \
            python3-aiohttp python3-yaml python3-pip
          # flatpak-cargo-generator needs tomlkit >= 0.11 (TOMLDocument.unwrap);
          # Ubuntu 22.04 ships 0.9. Pinned wheel with hash, no other packages.
          printf 'tomlkit==0.13.3 --hash=sha256:c89c649d79ee40629a9fda55f8ace8c6a1b42deb912b2a8fd8d942ddadb606b0\n' > /tmp/fcg-req.txt
          python3 -m pip install --user --no-deps --require-hashes --only-binary=:all: -r /tmp/fcg-req.txt
      - name: Frontend and crate sources
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          curl -fsSLo /tmp/fcg.py "https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/${FCG_COMMIT}/cargo/flatpak-cargo-generator.py"
          echo "${FCG_SHA256}  /tmp/fcg.py" | sha256sum -c -
          python3 /tmp/fcg.py Cargo.lock -o packaging/flatpak/cargo-sources.json
          desktop-file-validate packaging/flatpak/dev.herz.Ps2Tracker.desktop
      - name: flatpak-builder
        env:
          CENSUS_DEFAULT_SERVICE_ID: ${{ secrets.CENSUS_DEFAULT_SERVICE_ID }}
          DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID }}
        run: |
          . tools/ci_build_env.sh
          # The sandbox does not see the job's environment. Cargo's [env] in a
          # temporary project-level .cargo/config.toml (not in the repo, not an
          # artefact) passes the values to rustc. Not via build-options env:
          # flatpak-builder stores the manifest incl. env as /app/manifest.json.
          mkdir -p .cargo
          : > .cargo/config.toml
          if [ -n "${PS2_DEFAULT_SERVICE_ID:-}" ] || [ -n "${PS2_DEFAULT_DISCORD_APP_ID:-}" ]; then
            printf '[env]\n' >> .cargo/config.toml
            [ -z "${PS2_DEFAULT_SERVICE_ID:-}" ] || printf 'PS2_DEFAULT_SERVICE_ID = "%s"\n' "$PS2_DEFAULT_SERVICE_ID" >> .cargo/config.toml
            [ -z "${PS2_DEFAULT_DISCORD_APP_ID:-}" ] || printf 'PS2_DEFAULT_DISCORD_APP_ID = "%s"\n' "$PS2_DEFAULT_DISCORD_APP_ID" >> .cargo/config.toml
          fi
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # MetaInfo check with a current AppStream: appstreamcli from Ubuntu
          # 22.04 (0.15) does not know <developer> and url type vcs-browser
          # and fails on valid files. org.flatpak.Builder ships a current one.
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
          flatpak run --command=appstreamcli org.flatpak.Builder \
            validate --no-net --explain packaging/flatpak/dev.herz.Ps2Tracker.metainfo.xml
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --force-clean --repo=flatpak-repo flatpak-build packaging/flatpak/dev.herz.Ps2Tracker.yml
          rm -f .cargo/config.toml
          mkdir -p out
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo out/ps2-tracker.flatpak dev.herz.Ps2Tracker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak
          path: out/
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [verify, linux, arch, windows, flatpak]
    if: >-
      !cancelled() && needs.verify.result == 'success' && needs.linux.result == 'success'
      && needs.arch.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write # create the release and upload its files
      id-token: write # OIDC token for the provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Checksums, updater manifest, release text
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cp THIRD-PARTY-NOTICES.md LICENSE-MIT LICENSE-APACHE out/
          if [ -e out/ps2-tracker-x86_64.AppImage.sig ] || [ -e out/ps2-tracker-x64-setup.exe.sig ]; then
            python3 -I tools/updater_manifest.py "$VERSION" out \
              "https://github.com/${REPO}/releases/download/${TAG}" CHANGELOG.md > out/latest.json
          fi
          (cd out && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          python3 -I tools/release_notes.py "$VERSION" CHANGELOG.md > release-notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --repo "$GITHUB_REPOSITORY" \
            --title "PS2 Session Tracker ${VERSION}" --notes-file release-notes.md out/*

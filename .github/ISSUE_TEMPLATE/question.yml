name: Question
description: How do I …? (Please check the wiki first.)
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Many answers are in the [wiki](https://github.com/Elementary-Beginnings/ps2-tracker/wiki) and in
        [Troubleshooting and FAQ](https://github.com/Elementary-Beginnings/ps2-tracker/wiki/Troubleshooting-and-FAQ).
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and platform
      description: Optional, e.g. "1.0.0, Flatpak on Fedora (GNOME, Wayland)".
